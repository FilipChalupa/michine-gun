<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mišine gun</title>
<meta name="description" content="Kočka, kulomet a myši místo nábojů. Rozvesel mrzouty dřív, než pošlapou mír.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1410; --wood:#5a3d22; --wood-dark:#3a2612; --cream:#f3e7cf; --yellow:#f5c400; --ink:#2b2119;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0f0c09; } }
  :root[data-theme="dark"]{ --bg:#0f0c09; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:Anton,Impact,"Arial Black",sans-serif;color:var(--cream)}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:16px;background:rgba(20,14,8,.55);backdrop-filter:blur(3px);text-align:center;z-index:2}
  #overlay.hidden{display:none}
  .sign{background:linear-gradient(180deg,#6b4a2b,#4d3419);border:6px solid var(--wood-dark);border-radius:10px;
    padding:14px 34px 12px;box-shadow:0 12px 30px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.35);position:relative;transform:rotate(-1.5deg)}
  .sign:before,.sign:after{content:"";position:absolute;top:-30px;width:6px;height:30px;background:#333;border-radius:3px}
  .sign:before{left:22px}.sign:after{right:22px}
  .sign h1{margin:0;font-size:clamp(46px,10vw,88px);line-height:1;letter-spacing:1px;color:var(--cream);
    text-shadow:2px 3px 0 #2b1a0c,0 0 14px rgba(0,0,0,.5)}
  .sign h1 span{color:var(--yellow)}
  .sign .sub{margin:6px 0 0;font-size:clamp(13px,2.2vw,18px);letter-spacing:3px;color:#d9c9a5}
  #msg{max-width:560px;font-family:Georgia,serif;font-size:clamp(15px,2.3vw,19px);line-height:1.45;margin:0;color:#f7efdc;text-shadow:0 1px 3px #000}
  #stats{font-size:clamp(18px,3vw,26px);letter-spacing:2px;text-shadow:0 2px 4px #000;line-height:1.5}
  #stats b{color:var(--yellow)}
  #btn{font:inherit;font-size:clamp(18px,3vw,26px);letter-spacing:3px;color:var(--ink);background:var(--yellow);border:0;border-radius:8px;
    padding:14px 30px;cursor:pointer;box-shadow:0 6px 0 #a88400,0 10px 20px rgba(0,0,0,.4);transition:transform .08s}
  #btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a88400}
  .hint{margin:0;font-family:Georgia,serif;font-size:13px;color:#cdbf9f;opacity:.9}
  #mute{position:fixed;right:12px;bottom:12px;z-index:3;font:inherit;font-size:14px;letter-spacing:1px;background:rgba(0,0,0,.45);color:var(--cream);
    border:2px solid rgba(243,231,207,.4);border-radius:6px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="sign"><h1>Mišine <span>gun</span></h1><p class="sub">VÍCE MYŠÍ. MÉNĚ NÁSILÍ.</p></div>
  <p id="msg">Mrzouti táhnou na naši pozici. Zamiř, drž tlačítko a zasyp je roztomilostí. Každý mrzout zasažený myší se rozveselí a odletí spokojený domů. Když se dostanou až k tobě, ubývá mír.</p>
  <div id="stats"></div>
  <button id="btn">ZAHÁJIT MÍROVOU MISI</button>
  <p class="hint">Myš / dotyk = míření a palba &middot; Mezerník = palba &middot; M = zvuk</p>
</div>
<button id="mute" title="Zvuk (M)">🔊 ZVUK</button>

<script>
(() => {
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg');
const statsEl = document.getElementById('stats');
const btn = document.getElementById('btn');
const muteBtn = document.getElementById('mute');
const FONT = 'Anton, Impact, "Arial Black", sans-serif';
const TAU = Math.PI * 2;

// W/H are world units; on narrow screens the whole scene is scaled down by SC
let W = 0, H = 0, DPR = 1, SC = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  SC = Math.min(1, Math.max(0.5, cw / 1100));
  W = cw / SC; H = ch / SC;
  canvas.width = Math.round(cw * DPR); canvas.height = Math.round(ch * DPR);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.3, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.3, y - s * 0.1, x, y + s * 0.9);
  ctx.closePath(); ctx.fill();
}
function stencil(text, x, y, size, color, align = 'left') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(text, x + 1.5, y + 1.5);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

// ---------- audio ----------
let AC = null, muted = false;
try { muted = localStorage.getItem('misine-mute') === '1'; } catch (e) {}
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol) {
  if (muted) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  squeak: () => tone('square', rnd(1600, 2600), 900, 0.09, 0.035),
  pop: () => { tone('sine', 520, 1200, 0.16, 0.08); tone('triangle', 900, 1800, 0.12, 0.03); },
  thud: () => { tone('triangle', 140, 45, 0.35, 0.18); tone('sawtooth', 90, 40, 0.3, 0.06); },
  wave: () => { tone('square', 440, 660, 0.15, 0.05); setTimeout(() => tone('square', 660, 880, 0.2, 0.05), 140); },
  over: () => { tone('sawtooth', 300, 60, 0.9, 0.12); },
};
function setMute(m) {
  muted = m; muteBtn.textContent = muted ? '🔇 TICHO' : '🔊 ZVUK';
  try { localStorage.setItem('misine-mute', muted ? '1' : '0'); } catch (e) {}
}
setMute(muted);
muteBtn.addEventListener('click', () => setMute(!muted));

// ---------- state ----------
const S = {
  running: false, over: false, time: 0,
  score: 0, best: 0, peace: 100, wave: 1, waveT: 0, combo: 0,
  ammo: 40, maxAmmo: 40, shots: 0, hits: 0,
  mice: [], grumps: [], parts: [], texts: [],
  spawnT: 1.2, fireT: 0, recoil: 0, shake: 0, fireAnim: 0, angle: -0.4,
};
try { S.best = parseInt(localStorage.getItem('misine-best') || '0', 10) || 0; } catch (e) {}
const pointer = { x: 0, y: 0, down: false, space: false };
const clouds = Array.from({ length: 7 }, (_, i) => ({ x: Math.random(), y: 0.05 + Math.random() * 0.3, s: rnd(0.7, 1.5), v: rnd(6, 14) }));

const gun = () => ({ x: Math.max(W * 0.24, 200), y: H * 0.72 });
const WAVE_LEN = 16;

function reset() {
  Object.assign(S, {
    running: true, over: false, time: 0, score: 0, peace: 100, wave: 1, waveT: 0, combo: 0,
    ammo: S.maxAmmo, shots: 0, hits: 0, mice: [], grumps: [], parts: [], texts: [],
    spawnT: 1.2, fireT: 0, recoil: 0, shake: 0, fireAnim: 0,
  });
  floatText(W * 0.55, H * 0.35, 'VLNA 1', '#f5c400', 60, 1.6);
}

// ---------- entities ----------
function spawnGrump() {
  const r = Math.random();
  let type = 's';
  if (S.wave >= 2 && r < 0.18 + S.wave * 0.02) type = 'b';
  else if (S.wave >= 3 && r < 0.45) type = 'f';
  const size = type === 'b' ? 46 : type === 'f' ? 22 : 30;
  const hp = type === 'b' ? 3 : 1;
  const base = type === 'f' ? 150 : type === 'b' ? 42 : 70;
  const speed = base * (1 + (S.wave - 1) * 0.07);
  S.grumps.push({
    x: W + size + 10, baseY: rnd(H * 0.16, H * 0.62), y: 0, size, hp, maxhp: hp, speed, type,
    happy: false, t: Math.random() * 10, fade: 1, hug: [], wob: rnd(0.8, 1.4),
  });
}

function fire() {
  const g = gun();
  const a = S.angle + rnd(-0.06, 0.06);
  const L = 128 - S.recoil * 10;
  const sx = g.x + Math.cos(a) * L, sy = g.y + Math.sin(a) * L;
  const sp = rnd(820, 920);
  S.mice.push({ x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: a, spin: rnd(-3, 3), t: 0 });
  S.ammo -= 1; S.shots++; S.recoil = 1; S.fireAnim = 0.12; S.shake = Math.max(S.shake, 2);
  for (let i = 0; i < 4; i++) S.parts.push({ kind: 'spark', x: sx, y: sy, vx: Math.cos(a + rnd(-0.5, 0.5)) * rnd(80, 260), vy: Math.sin(a + rnd(-0.5, 0.5)) * rnd(80, 260), life: rnd(0.12, 0.25), max: 0.25, r: rnd(2, 5) });
  S.parts.push({ kind: 'smoke', x: sx, y: sy, vx: rnd(-20, 40), vy: rnd(-60, -20), life: 0.7, max: 0.7, r: rnd(6, 12) });
  sfx.squeak();
}

function floatText(x, y, txt, color, size = 22, life = 1) {
  S.texts.push({ x, y, txt, color, size, life, max: life });
}
function burstHearts(x, y, n) {
  for (let i = 0; i < n; i++) S.parts.push({ kind: 'heart', x, y, vx: rnd(-90, 90), vy: rnd(-160, -40), life: rnd(0.8, 1.4), max: 1.4, r: rnd(5, 10), c: ['#ff6b8b', '#ff9ec2', '#f5c400', '#ff4d6d'][i % 4] });
}
function puff(x, y, n, c) {
  for (let i = 0; i < n; i++) S.parts.push({ kind: 'smoke', x, y, vx: rnd(-80, 80), vy: rnd(-90, 10), life: rnd(0.5, 0.9), max: 0.9, r: rnd(8, 18), c });
}

// ---------- update ----------
function update(dt) {
  if (!S.running) { for (const c of clouds) { c.x -= c.v * dt / W; if (c.x < -0.2) c.x += 1.4; } return; }
  S.time += dt; S.waveT += dt;
  const g = gun();

  // aiming
  const dx = pointer.x - g.x, dy = pointer.y - g.y;
  let target = Math.atan2(dy, dx);
  if (dx < 0) target = dy < 0 ? -1.45 : 0.2;
  target = clamp(target, -1.45, 0.22);
  S.angle += (target - S.angle) * Math.min(1, dt * 18);

  // firing
  S.fireT -= dt;
  if ((pointer.down || pointer.space) && S.fireT <= 0) {
    if (S.ammo >= 1) { fire(); S.fireT = 0.1; }
    else { S.fireT = 0.25; if (Math.random() < 0.5) floatText(g.x + 40, g.y - 70, 'DOCHÁZÍ MYŠI!', '#ffb3b3', 16, 0.6); }
  }
  S.ammo = Math.min(S.maxAmmo, S.ammo + 6 * dt);
  S.recoil = Math.max(0, S.recoil - dt * 9);
  S.fireAnim = Math.max(0, S.fireAnim - dt);
  S.shake = Math.max(0, S.shake - dt * 14);

  // waves
  if (S.waveT >= WAVE_LEN) {
    S.waveT = 0; S.wave++;
    floatText(W * 0.55, H * 0.35, 'VLNA ' + S.wave, '#f5c400', 60, 1.6);
    if (S.wave === 2) floatText(W * 0.55, H * 0.35 + 50, 'Pozor, velcí mrzouti potřebují 3 myši!', '#f3e7cf', 20, 2.4);
    if (S.wave === 3) floatText(W * 0.55, H * 0.35 + 50, 'Rychlí mrzouti! Miř před ně.', '#f3e7cf', 20, 2.4);
    sfx.wave();
  }
  S.spawnT -= dt;
  if (S.spawnT <= 0) {
    spawnGrump();
    const interval = 1.7 / (1 + (S.wave - 1) * 0.22);
    S.spawnT = Math.max(0.32, interval * rnd(0.6, 1.3));
  }

  // clouds
  for (const c of clouds) { c.x -= c.v * dt / W; if (c.x < -0.2) c.x += 1.4; }

  // mice
  for (let i = S.mice.length - 1; i >= 0; i--) {
    const m = S.mice[i];
    m.t += dt; m.x += m.vx * dt; m.y += m.vy * dt; m.vy += 260 * dt; m.rot = Math.atan2(m.vy, m.vx) + Math.sin(m.t * 20) * 0.15;
    let hit = false;
    for (const gr of S.grumps) {
      if (gr.happy) continue;
      const ddx = gr.x - m.x, ddy = gr.y - m.y;
      if (ddx * ddx + ddy * ddy < (gr.size + 8) ** 2) {
        gr.hp--; S.hits++; hit = true;
        if (gr.hug.length < 4) gr.hug.push({ dx: ddx * -0.7 + rnd(-6, 6), dy: ddy * -0.7 + rnd(-6, 6), rot: rnd(-1, 1) });
        if (gr.hp <= 0) {
          gr.happy = true; S.combo++;
          const mult = 1 + Math.min(S.combo, 30) * 0.1;
          const pts = Math.round(10 * gr.maxhp * (gr.type === 'f' ? 1.5 : 1) * mult);
          S.score += pts; S.peace = Math.min(100, S.peace + (gr.type === 'b' ? 3 : 1));
          floatText(gr.x, gr.y - gr.size - 10, '+' + pts + (S.combo >= 5 ? '  x' + mult.toFixed(1) : ''), '#f5c400', 22, 1);
          burstHearts(gr.x, gr.y, gr.type === 'b' ? 14 : 8); sfx.pop();
        } else {
          floatText(gr.x, gr.y - gr.size - 10, 'hmpf', '#ddd', 16, 0.5);
          tone('sine', 300, 380, 0.08, 0.04);
        }
        break;
      }
    }
    if (hit || m.x > W + 40 || m.y > H + 40 || m.x < -40) S.mice.splice(i, 1);
  }

  // grumps
  for (let i = S.grumps.length - 1; i >= 0; i--) {
    const gr = S.grumps[i];
    gr.t += dt;
    if (!gr.happy) {
      gr.x -= gr.speed * dt;
      gr.y = gr.baseY + Math.sin(gr.t * 2 * gr.wob) * 12;
      if (gr.x < g.x + 70) {
        const dmg = gr.type === 'b' ? 20 : gr.type === 'f' ? 7 : 10;
        S.peace -= dmg; S.combo = 0; S.shake = 10;
        puff(gr.x, gr.y, 12, '#4b4b50'); sfx.thud();
        floatText(g.x + 60, g.y - 90, '-' + dmg + ' MÍR', '#ff6b6b', 26, 1.2);
        S.grumps.splice(i, 1);
        if (S.peace <= 0) { S.peace = 0; gameOver(); return; }
      }
    } else {
      gr.y -= 70 * dt; gr.x += 25 * dt; gr.fade -= dt * 0.7;
      if (Math.random() < dt * 6) S.parts.push({ kind: 'heart', x: gr.x + rnd(-gr.size, gr.size), y: gr.y, vx: rnd(-20, 20), vy: -60, life: 0.8, max: 0.8, r: rnd(3, 6), c: '#ff7f9f' });
      if (gr.fade <= 0) S.grumps.splice(i, 1);
    }
  }

  // particles & texts
  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'heart') p.vy -= 20 * dt; if (p.kind === 'smoke') { p.vy -= 30 * dt; p.r += 12 * dt; }
    if (p.life <= 0) S.parts.splice(i, 1);
  }
  for (let i = S.texts.length - 1; i >= 0; i--) { const t = S.texts[i]; t.life -= dt; t.y -= 28 * dt; if (t.life <= 0) S.texts.splice(i, 1); }
}

function gameOver() {
  S.running = false; S.over = true; sfx.over();
  if (S.score > S.best) { S.best = S.score; try { localStorage.setItem('misine-best', String(S.best)); } catch (e) {} }
  const acc = S.shots ? Math.round(100 * S.hits / S.shots) : 0;
  msgEl.textContent = 'Mrzouti prorazili linii a mír je v troskách. Ale spousta z nich odešla s úsměvem a myší v náručí. Zkusíš to znovu?';
  statsEl.innerHTML = `SKÓRE <b>${S.score}</b> &nbsp;·&nbsp; NEJLEPŠÍ <b>${S.best}</b><br>VLNA <b>${S.wave}</b> &nbsp;·&nbsp; ROZVESELENO <b>${S.hits}</b> &nbsp;·&nbsp; PŘESNOST <b>${acc}%</b>`;
  btn.textContent = 'ZKUSIT ZNOVU';
  overlay.classList.remove('hidden');
}

// ---------- drawing ----------
function drawMouse(x, y, rot, s, scream) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.strokeStyle = '#e8a0a0'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.quadraticCurveTo(-20, -8, -26, 3); ctx.stroke();
  ctx.strokeStyle = '#9d8a6e'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(9, 10); ctx.moveTo(-4, 5); ctx.lineTo(-9, 10); ctx.moveTo(6, -3); ctx.lineTo(11, -9); ctx.moveTo(-5, -4); ctx.lineTo(-10, -9); ctx.stroke();
  ctx.fillStyle = '#b9a68a'; ellipse(0, 0, 13, 7.5);
  ctx.fillStyle = '#d9cbb2'; ellipse(1, 2.5, 9, 3.5);
  ctx.fillStyle = '#b9a68a'; circle(3, -7, 4.2); circle(7.5, -6.5, 3.8);
  ctx.fillStyle = '#f0b0b0'; circle(3, -7, 2.3); circle(7.5, -6.5, 2);
  ctx.fillStyle = '#222'; circle(8, -2, 1.7); ctx.fillStyle = '#fff'; circle(8.6, -2.6, 0.6);
  ctx.fillStyle = '#e88a8a'; circle(13.5, 0.5, 1.7);
  if (scream) { ctx.fillStyle = '#b8302b'; ellipse(10.5, 3, 2.3, 2.6); }
  ctx.strokeStyle = 'rgba(40,30,20,.5)'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(12, 1); ctx.lineTo(18, -2); ctx.moveTo(12, 2); ctx.lineTo(18, 4); ctx.stroke();
  ctx.restore();
}

function drawGrump(gr) {
  ctx.save(); ctx.translate(gr.x, gr.y); ctx.globalAlpha = Math.max(0, gr.fade);
  const s = gr.size, happy = gr.happy;
  if (gr.type === 'f' && !happy) {
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(s + 6, i * 8); ctx.lineTo(s + 22 + Math.abs(i) * 6, i * 8); ctx.stroke(); }
  }
  ctx.fillStyle = happy ? '#f4a6ba' : gr.type === 'b' ? '#5e6069' : gr.type === 'f' ? '#9a9ca6' : '#84868f';
  ctx.strokeStyle = happy ? '#c7607f' : '#34353b'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= 10; i++) {
    const a = i / 10 * TAU, r = s * (1 + 0.1 * Math.sin(gr.t * 4 + i * 2.3));
    const px = Math.cos(a) * r, py = Math.sin(a) * r * 0.92;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  const e = s * 0.32, ey = -s * 0.12;
  if (!happy) {
    ctx.fillStyle = '#fff'; circle(-e, ey, s * 0.2); circle(e, ey, s * 0.2);
    ctx.fillStyle = '#1a1a1a'; circle(-e + 2, ey + 2, s * 0.09); circle(e - 2, ey + 2, s * 0.09);
    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = Math.max(3, s * 0.12); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-e - s * 0.25, ey - s * 0.4); ctx.lineTo(-e + s * 0.18, ey - s * 0.2);
    ctx.moveTo(e + s * 0.25, ey - s * 0.4); ctx.lineTo(e - s * 0.18, ey - s * 0.2); ctx.stroke();
    ctx.lineWidth = Math.max(2.5, s * 0.09);
    ctx.beginPath(); ctx.arc(0, s * 0.55, s * 0.3, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    if (gr.type === 'b') {
      ctx.fillStyle = '#3f4530'; ctx.beginPath(); ctx.arc(0, -s * 0.45, s * 0.72, Math.PI, 0); ctx.fill();
      ctx.fillRect(-s * 0.8, -s * 0.5, s * 1.6, s * 0.12);
      ctx.fillStyle = '#e0d68a'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(-s * 0.25 + i * s * 0.25, -s * 0.85, 3, 0, TAU); ctx.fill(); }
    }
    if (gr.maxhp > 1) {
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(-s * 0.6, -s - 14, s * 1.2, 6);
      ctx.fillStyle = '#ff8f8f'; ctx.fillRect(-s * 0.6, -s - 14, s * 1.2 * (gr.hp / gr.maxhp), 6);
    }
  } else {
    ctx.strokeStyle = '#7a2b45'; ctx.lineWidth = Math.max(3, s * 0.1); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-e, ey, s * 0.16, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(e, ey, s * 0.16, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.fillStyle = 'rgba(255,90,120,.45)'; circle(-e - s * 0.25, ey + s * 0.3, s * 0.14); circle(e + s * 0.25, ey + s * 0.3, s * 0.14);
    ctx.beginPath(); ctx.arc(0, s * 0.2, s * 0.35, Math.PI * 0.1, Math.PI * 0.9); ctx.stroke();
  }
  for (const h of gr.hug) drawMouse(h.dx, h.dy, h.rot, 0.8, false);
  ctx.restore();
}

function drawCat(x, y, firing) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#4f5636'; rrect(-46, 24, 92, 70, 16); ctx.fill();
  ctx.fillStyle = '#3d4329'; rrect(-30, 34, 22, 26, 4); ctx.fill(); rrect(8, 34, 22, 26, 4); ctx.fill();
  ctx.fillStyle = '#c19a5b';
  ctx.beginPath(); ctx.moveTo(-34, -20); ctx.lineTo(-46, -52); ctx.lineTo(-14, -34); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(34, -20); ctx.lineTo(46, -52); ctx.lineTo(14, -34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e5a8a8';
  ctx.beginPath(); ctx.moveTo(-32, -24); ctx.lineTo(-40, -44); ctx.lineTo(-20, -33); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(32, -24); ctx.lineTo(40, -44); ctx.lineTo(20, -33); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c19a5b'; ellipse(0, 0, 42, 37);
  ctx.strokeStyle = '#8a6335'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-40, -6); ctx.lineTo(-28, -2); ctx.moveTo(-41, 6); ctx.lineTo(-29, 8); ctx.moveTo(40, -6); ctx.lineTo(28, -2); ctx.moveTo(41, 6); ctx.lineTo(29, 8); ctx.stroke();
  ctx.fillStyle = '#e6c9a0'; ellipse(0, 16, 22, 16);
  ctx.fillStyle = '#4a5232'; ctx.beginPath(); ctx.arc(0, -14, 48, Math.PI, 0); ctx.lineTo(48, -8); ctx.lineTo(-48, -8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#353b25'; rrect(-52, -12, 104, 9, 3); ctx.fill();
  ctx.strokeStyle = '#d8d8c8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-26, -30, 9, 0, TAU); ctx.moveTo(-26, -39); ctx.lineTo(-26, -21); ctx.moveTo(-26, -30); ctx.lineTo(-32.5, -23.5); ctx.moveTo(-26, -30); ctx.lineTo(-19.5, -23.5); ctx.stroke();
  ctx.fillStyle = '#111'; rrect(-38, -8, 32, 17, 7); ctx.fill(); rrect(6, -8, 32, 17, 7); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(6, -3); ctx.moveTo(-38, -3); ctx.lineTo(-46, -8); ctx.moveTo(38, -3); ctx.lineTo(46, -8); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rrect(-33, -6, 10, 4, 2); ctx.fill(); rrect(11, -6, 10, 4, 2); ctx.fill();
  ctx.fillStyle = '#e9a3a3'; ctx.beginPath(); ctx.moveTo(0, 15); ctx.lineTo(-5, 9); ctx.lineTo(5, 9); ctx.closePath(); ctx.fill();
  if (firing) {
    ctx.fillStyle = '#7d1717'; ellipse(0, 26, 15, 12);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-9, 16); ctx.lineTo(-5, 26); ctx.lineTo(-1, 16); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(9, 16); ctx.lineTo(5, 26); ctx.lineTo(1, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d34a4a'; ellipse(0, 32, 7, 4);
  } else {
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-8, 22); ctx.quadraticCurveTo(-4, 27, 0, 22); ctx.quadraticCurveTo(4, 27, 8, 22); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (const sgn of [-1, 1]) { ctx.moveTo(sgn * 14, 16); ctx.lineTo(sgn * 58, 8); ctx.moveTo(sgn * 14, 20); ctx.lineTo(sgn * 60, 22); ctx.moveTo(sgn * 14, 24); ctx.lineTo(sgn * 56, 36); } ctx.stroke();
  ctx.restore();
}

function drawGun() {
  const g = gun();
  const boxX = g.x - 60, boxY = g.y + 34, boxW = 180, boxH = 86;
  ctx.fillStyle = '#5a4526'; rrect(boxX, boxY, boxW, boxH, 4); ctx.fill();
  ctx.strokeStyle = '#3a2a14'; ctx.lineWidth = 3; ctx.strokeRect(boxX, boxY, boxW, boxH);
  ctx.strokeStyle = '#7a6238'; ctx.lineWidth = 2; ctx.strokeRect(boxX + 10, boxY + 10, boxW - 20, boxH - 20);
  stencil('ŽIVÁ MUNICE', boxX + boxW / 2, boxY + 34, 16, '#d8c9a3', 'center');
  drawMouse(boxX + boxW / 2, boxY + 62, 0, 0.8, false);
  ctx.fillStyle = '#3a2a14'; for (const [cx, cy] of [[boxX + 8, boxY + 6], [boxX + boxW - 8, boxY + 6], [boxX + 8, boxY + boxH - 6], [boxX + boxW - 8, boxY + boxH - 6]]) circle(cx, cy, 3);

  // ammo belt (visible ammo) hangs from the gun down past the cat
  const n = Math.min(12, Math.floor(S.ammo / (S.maxAmmo / 12)) + (S.ammo > 0 ? 1 : 0));
  const b0x = g.x - 44, b0y = g.y + 6, b1x = g.x - 205, b1y = g.y + 118;
  const brot = Math.atan2(b0y - b1y, b0x - b1x);
  for (let i = 0; i < n; i++) {
    const t = i / 12;
    const bx = b0x + (b1x - b0x) * t + Math.sin(t * 7) * 5, by = b0y + (b1y - b0y) * t;
    drawMouse(bx, by, brot + Math.sin(t * 9) * 0.15, 0.7, false);
  }

  // turret base
  ctx.fillStyle = '#2b2b29'; rrect(g.x - 48, g.y - 18, 96, 56, 6); ctx.fill();
  ctx.strokeStyle = '#141413'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#3a3a37'; rrect(g.x - 40, g.y - 10, 80, 40, 4); ctx.fill();
  stencil('ŠIŘ ROZTOMILOST', g.x, g.y + 4, 11, '#c9c1ad', 'center');
  stencil('NE KULKY ♥', g.x, g.y + 18, 11, '#c9c1ad', 'center');
  ctx.fillStyle = '#5a5a55'; for (const [cx, cy] of [[g.x - 42, g.y - 12], [g.x + 42, g.y - 12], [g.x - 42, g.y + 32], [g.x + 42, g.y + 32]]) circle(cx, cy, 3);
  ctx.strokeStyle = '#26262a'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(g.x - 30, g.y + 36); ctx.lineTo(g.x - 50, g.y + 70); ctx.moveTo(g.x + 30, g.y + 36); ctx.lineTo(g.x + 50, g.y + 70); ctx.stroke();

  // rotating part
  ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(S.angle);
  const rec = -S.recoil * 10;
  ctx.translate(rec, 0);
  ctx.fillStyle = '#1f1f1e'; rrect(-30, -22, 70, 44, 6); ctx.fill();
  ctx.fillStyle = '#2f2f2c'; rrect(30, -11, 70, 22, 3); ctx.fill();
  ctx.fillStyle = '#262624'; rrect(100, -9, 30, 18, 2); ctx.fill();
  ctx.fillStyle = '#141414'; rrect(118, -13, 16, 26, 3); ctx.fill();
  ctx.fillStyle = '#3a3a37'; for (let i = 0; i < 5; i++) ctx.fillRect(38 + i * 12, -11, 4, 22);
  ctx.fillStyle = '#1a1a19'; rrect(-24, -30, 40, 12, 3); ctx.fill();
  ctx.fillStyle = '#1a1a19'; rrect(-14, 20, 14, 26, 3); ctx.fill();
  if (S.fireAnim > 0) {
    ctx.globalAlpha = S.fireAnim / 0.12;
    ctx.fillStyle = '#ffd35a'; ctx.beginPath(); ctx.moveTo(134, 0);
    for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, r = i % 2 ? 12 : 26; ctx.lineTo(134 + 14 + Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff4c2'; circle(148, 0, 7); ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.fillStyle = '#c19a5b'; ellipse(g.x - 40, g.y - 6, 13, 9, -0.3); ellipse(g.x - 36, g.y + 16, 12, 9, 0.3);
  ctx.strokeStyle = '#8a6335'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-46 + g.x, g.y - 8); ctx.lineTo(-38 + g.x, g.y - 8); ctx.moveTo(-42 + g.x, g.y + 14); ctx.lineTo(-34 + g.x, g.y + 14); ctx.stroke();
}

function drawTower(x, y, s, banner) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = '#4a3a24'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(-24, -120); ctx.moveTo(34, 0); ctx.lineTo(24, -120);
  ctx.moveTo(-32, -30); ctx.lineTo(32, -30); ctx.moveTo(-30, -60); ctx.lineTo(30, -60); ctx.moveTo(-28, -90); ctx.lineTo(28, -90);
  ctx.moveTo(-32, -30); ctx.lineTo(28, -90); ctx.moveTo(32, -30); ctx.lineTo(-28, -90); ctx.stroke();
  ctx.fillStyle = '#5a4629'; ctx.fillRect(-40, -130, 80, 12); ctx.fillRect(-42, -160, 84, 6);
  ctx.strokeStyle = '#4a3a24'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-36, -130); ctx.lineTo(-36, -160); ctx.moveTo(36, -130); ctx.lineTo(36, -160); ctx.moveTo(0, -130); ctx.lineTo(0, -160); ctx.stroke();
  ctx.fillStyle = '#6a5533'; ctx.beginPath(); ctx.moveTo(-50, -160); ctx.lineTo(0, -185); ctx.lineTo(50, -160); ctx.closePath(); ctx.fill();
  if (banner) {
    ctx.fillStyle = '#eee4cc'; ctx.beginPath(); ctx.moveTo(-40, -115); ctx.lineTo(40, -118); ctx.lineTo(42, -40); ctx.lineTo(-38, -36); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b9ac8c'; ctx.lineWidth = 2; ctx.stroke();
    stencil('MÍR', 1, -96, 18, '#4a4235', 'center'); stencil('SKRZE', 1, -78, 18, '#4a4235', 'center'); stencil('MYŠI', 1, -60, 18, '#4a4235', 'center');
    ctx.fillStyle = '#6a6050'; circle(1, -46, 3); circle(-5, -50, 1.8); circle(7, -50, 1.8); circle(-2, -54, 1.6); circle(4, -54, 1.6);
  }
  ctx.restore();
}

function drawSandbags(x0, x1, y, rows) {
  for (let r = 0; r < rows; r++) {
    const off = r % 2 ? 24 : 0;
    for (let x = x0 + off; x < x1; x += 48) {
      ctx.fillStyle = r % 2 ? '#c9b283' : '#bfa676'; ellipse(x, y + r * 20, 26, 12);
      ctx.strokeStyle = '#8b7549'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(x, y + r * 20, 26, 12, 0, 0, TAU); ctx.stroke();
    }
  }
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#4f8fcf'); sky.addColorStop(0.45, '#bcd7ea'); sky.addColorStop(0.7, '#efdcb8'); sky.addColorStop(1, '#c79a56');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  const sun = ctx.createRadialGradient(W * 0.85, H * 0.12, 10, W * 0.85, H * 0.12, W * 0.3);
  sun.addColorStop(0, 'rgba(255,240,200,.85)'); sun.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const c of clouds) {
    const cx = c.x * W, cy = c.y * H, s = c.s * 30;
    ellipse(cx, cy, s * 1.6, s * 0.6); ellipse(cx - s, cy + s * 0.1, s, s * 0.5); ellipse(cx + s * 0.9, cy + s * 0.05, s * 1.1, s * 0.55); ellipse(cx + s * 0.1, cy - s * 0.35, s * 0.9, s * 0.6);
  }
  ctx.fillStyle = '#7f8a56'; ctx.beginPath(); ctx.moveTo(0, H * 0.62);
  ctx.quadraticCurveTo(W * 0.2, H * 0.5, W * 0.4, H * 0.6); ctx.quadraticCurveTo(W * 0.6, H * 0.68, W * 0.75, H * 0.55); ctx.quadraticCurveTo(W * 0.9, H * 0.46, W, H * 0.58);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#98955a'; ctx.beginPath(); ctx.moveTo(0, H * 0.7);
  ctx.quadraticCurveTo(W * 0.3, H * 0.62, W * 0.55, H * 0.7); ctx.quadraticCurveTo(W * 0.8, H * 0.76, W, H * 0.66);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
  drawTower(W * 0.6, H * 0.72, 0.85, false);
  drawTower(W * 0.86, H * 0.74, 1.05, true);
  ctx.fillStyle = '#b08a4a'; ctx.fillRect(0, H * 0.78, W, H);
  ctx.fillStyle = '#9a7740'; for (let i = 0; i < 40; i++) { const x = ((i * 977) % 1000) / 1000 * W, y = H * 0.8 + ((i * 613) % 1000) / 1000 * H * 0.2; ellipse(x, y, 8, 3); }
  drawSandbags(W * 0.42, W + 40, H * 0.79, 3);
  // wooden sign in the field
  const sx = W * 0.5, sy = H * 0.63;
  ctx.fillStyle = '#3f2c17'; ctx.fillRect(sx - 4, sy, 8, H * 0.18);
  ctx.fillStyle = '#5a3d22'; rrect(sx - 74, sy - 6, 148, 96, 5); ctx.fill(); ctx.strokeStyle = '#2f1e0d'; ctx.lineWidth = 3; ctx.stroke();
  stencil('ŠŤASTNĚJŠÍ SVĚT', sx, sy + 14, 15, '#eadcbc', 'center'); stencil('JEDNU MYŠ', sx, sy + 34, 15, '#eadcbc', 'center');
  stencil('PO DRUHÉ', sx, sy + 54, 15, '#eadcbc', 'center');
  ctx.fillStyle = '#d8b8b0'; heart(sx, sy + 76, 6);
}

function drawTitleSign() {
  const x = 16, y = 14, w = 250, h = 68;
  ctx.strokeStyle = '#3b3b3b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 30, 0); ctx.lineTo(x + 30, y); ctx.moveTo(x + w - 30, 0); ctx.lineTo(x + w - 30, y); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rrect(x + 4, y + 6, w, h, 6); ctx.fill();
  ctx.fillStyle = '#5a3d22'; rrect(x, y, w, h, 6); ctx.fill(); ctx.strokeStyle = '#2f1e0d'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x + 8, y + 14 + i * 14); ctx.lineTo(x + w - 8, y + 12 + i * 14 + (i % 2) * 3); ctx.stroke(); }
  ctx.font = `36px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const w1 = ctx.measureText('Mišine ').width;
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText('Mišine ', x + 16 + 2, y + 27 + 2); ctx.fillText('gun', x + 16 + w1 + 2, y + 27 + 2);
  ctx.fillStyle = '#f3e7cf'; ctx.fillText('Mišine ', x + 16, y + 27);
  ctx.fillStyle = '#f5c400'; ctx.fillText('gun', x + 16 + w1, y + 27);
  stencil('VÍCE MYŠÍ. MÉNĚ NÁSILÍ.', x + 16, y + 54, 12, '#d9c9a5');
}

function drawHUD() {
  const right = W - 16;
  const pw0 = Math.min(220, W * 0.3);
  ctx.fillStyle = 'rgba(20,14,8,.42)'; rrect(right - pw0 - 30, 8, pw0 + 40, 176, 10); ctx.fill();
  stencil('SKÓRE', right, 26, 14, '#f3e7cf', 'right');
  stencil(String(S.score), right, 52, 34, '#f5c400', 'right');
  stencil('NEJLEPŠÍ ' + S.best, right, 78, 13, '#e0d3b3', 'right');
  stencil('VLNA ' + S.wave, right, 100, 18, '#f3e7cf', 'right');
  if (S.combo >= 5) stencil('KOMBO x' + (1 + Math.min(S.combo, 30) * 0.1).toFixed(1), right, 122, 16, '#ff9ec2', 'right');

  // peace meter
  const pw = pw0, px = right - pw, py = 136;
  ctx.fillStyle = '#ff6b8b'; heart(px - 14, py + 8, 8);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rrect(px, py, pw, 16, 8); ctx.fill();
  const pc = S.peace / 100;
  ctx.fillStyle = pc > 0.5 ? '#ff6b8b' : pc > 0.25 ? '#ffb347' : '#ff4d4d';
  if (pc > 0) { rrect(px, py, Math.max(16, pw * pc), 16, 8); ctx.fill(); }
  stencil('MÍR ' + Math.round(S.peace) + '%', px + pw / 2, py + 8, 12, '#fff', 'center');

  // ammo meter
  const ay = py + 26;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rrect(px, ay, pw, 12, 6); ctx.fill();
  ctx.fillStyle = S.ammo < 5 ? '#ff8f8f' : '#d9cbb2'; rrect(px, ay, Math.max(12, pw * S.ammo / S.maxAmmo), 12, 6); ctx.fill();
  stencil('MYŠI ' + Math.floor(S.ammo), px + pw / 2, ay + 6, 10, '#2b2119', 'center');
  drawMouse(px - 14, ay + 6, 0, 0.55, false);
}

function draw() {
  ctx.save();
  if (S.shake > 0) ctx.translate(rnd(-S.shake, S.shake), rnd(-S.shake, S.shake));
  drawBackground();
  for (const gr of S.grumps) drawGrump(gr);
  const g = gun();
  drawCat(g.x - 118, g.y - 28, S.fireAnim > 0 || (S.running && (pointer.down || pointer.space)));
  drawGun();
  for (const m of S.mice) drawMouse(m.x, m.y, m.rot, 1.1, true);
  for (const p of S.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    if (p.kind === 'heart') { ctx.fillStyle = p.c; heart(p.x, p.y, p.r); }
    else if (p.kind === 'spark') { ctx.fillStyle = '#ffd35a'; circle(p.x, p.y, p.r * a); }
    else { ctx.fillStyle = p.c || 'rgba(230,220,200,.9)'; ctx.globalAlpha = a * 0.6; circle(p.x, p.y, p.r); }
    ctx.globalAlpha = 1;
  }
  for (const t of S.texts) {
    ctx.globalAlpha = clamp(t.life / t.max * 1.5, 0, 1);
    stencil(t.txt, t.x, t.y, t.size, t.color, 'center'); ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawTitleSign();
  drawHUD();
  if (S.running && S.time < 4) {
    ctx.globalAlpha = clamp(4 - S.time, 0, 1);
    stencil('DRŽ TLAČÍTKO A PAL!', W * 0.55, H * 0.28, 26, '#fff', 'center'); ctx.globalAlpha = 1;
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- input ----------
canvas.addEventListener('pointerdown', e => { pointer.x = e.clientX / SC; pointer.y = e.clientY / SC; pointer.down = true; ac(); try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
canvas.addEventListener('pointermove', e => { pointer.x = e.clientX / SC; pointer.y = e.clientY / SC; });
canvas.addEventListener('pointerup', () => { pointer.down = false; });
canvas.addEventListener('pointercancel', () => { pointer.down = false; });
window.addEventListener('blur', () => { pointer.down = false; pointer.space = false; });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { pointer.space = true; e.preventDefault(); if (!S.running && !overlay.classList.contains('hidden')) btn.click(); }
  if (e.key === 'm' || e.key === 'M') setMute(!muted);
});
window.addEventListener('keyup', e => { if (e.code === 'Space') pointer.space = false; });
btn.addEventListener('click', () => { ac(); overlay.classList.add('hidden'); pointer.x = W * 0.7; pointer.y = H * 0.4; reset(); });
pointer.x = W * 0.7; pointer.y = H * 0.4;
})();
</script>
